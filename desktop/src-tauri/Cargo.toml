[package]
name = "kerfscript-desktop"
version = "0.4.0"
description = "KerfScript: a programming language for laser cutting"
authors = ["MyLaserTools"]
license = "AGPL-3.0-only"
repository = "https://github.com/mylasertools/kerfscript"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# LightBurn REST API: plain HTTP on localhost, so no TLS
ureq = { version = "3", default-features = false }
hmac = "0.13"
sha2 = "0.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
